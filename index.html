<title>Holiday Card Studio</title>

<style>

body{margin:0;background:var(--bg);color:var(--tx);font:16px Montserrat,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.w{max-width:560px;margin:auto}h1{font:800 30px/1.1 'Playfair Display',serif;margin:14px 0 6px}p.s{color:var(--mu);margin:0 0 18px;line-height:1.5}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid #3a2f2b;border-radius:16px;padding:14px;margin-bottom:16px;color:var(--tx);font:inherit;cursor:pointer}
.tile h2{font:800 22px 'Playfair Display',serif;margin:12px 0 2px}.tile span{color:var(--ac);font-size:14px}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tp img{width:100%;border-radius:8px;display:block;aspect-ratio:4/5;object-fit:cover;background:#2a201d}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}.top button{background:var(--card);color:var(--tx);border:1px solid #3a2f2b;border-radius:10px;min-height:44px;padding:0 16px;font:inherit}.top b{font:800 20px 'Playfair Display',serif}
canvas{width:100%;height:auto;border-radius:10px;display:block;box-shadow:0 10px 40px #0008}
.th{display:flex;gap:8px;overflow-x:auto;padding:12px 2px;scroll-snap-type:x proximity}
.th button{flex:none;width:84px;height:84px;border-radius:10px;border:2px solid transparent;font:600 11px Montserrat;cursor:pointer;padding:2px;scroll-snap-align:start}.th button.on{border-color:var(--ac);outline:2px solid var(--ac);outline-offset:2px}
label{display:block;color:var(--mu);font-size:13px;margin:12px 0 4px}
input,textarea{width:100%;background:var(--card);border:1px solid #3a2f2b;color:var(--tx);border-radius:10px;padding:12px;font:inherit;min-height:46px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac)}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(transparent,var(--bg) 30%);margin-top:14px}
.b{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--ac);color:#201400;font:600 16px Montserrat;cursor:pointer}.b.g{background:var(--card);color:var(--tx);border:1px solid #3a2f2b;margin-top:10px}

<button class="tile" data-m="wish"><div class="tp" id="tp-wish"></div><h2>Wishes Cards</h2><span>10 templates · greeting, name, message, photo</span></button></main>
<main id="ed" hidden><div class="top"><button id="back">← Back</button><b id="ttl"></b></div>
<canvas id="c" width="1080" height="1350"></canvas><div class="th" id="th" role="group" aria-label="Templates"></div>

<div class="r iv"><div><label>Date</label><input id="date"></div><div><label>Time</label><input id="time"></div></div>
<div class="iv"><label>Venue</label><input id="venue"></div>
<label>Message</label><textarea id="msg" rows="3"></textarea>
<label id="l-host">From</label><input id="host">
<label id="l-guest">Name on this card</label><input id="guest">
<label>Add a photo (optional)</label><input id="ph" type="file" accept="image/*">
<label style="margin-top:18px">Bulk: one name per line</label><textarea id="bulk" rows="4" placeholder="Riya&#10;Karan&#10;Meera"></textarea>
